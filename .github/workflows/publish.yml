name: Publish
on:
  push:
    branches: [main]
    paths: ["sources/**", "templates/**", "runtime/**", "scripts/**", "package.json", "package-lock.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-branch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Check out repo branch
        env: { REMOTE: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" }
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" repo; then
            git clone --branch repo --single-branch --depth 1 "$REMOTE" out
          else
            mkdir out && git -C out init -b repo && git -C out remote add origin "$REMOTE"
          fi
      - run: node scripts/build.mjs --out out --previous out/index.json
      - name: Push repo branch
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push origin repo
