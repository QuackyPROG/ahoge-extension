name: Publish
on:
  push:
    branches: [main]
    paths: ["sources/**", "templates/**", "runtime/**", "scripts/**", "package.json", "package-lock.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Check out repo branch
        env: { REMOTE: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" }
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" repo >/dev/null; then
            git clone --branch repo --single-branch --depth 1 "$REMOTE" out
          else
            mkdir out && git -C out init -b repo && git -C out remote add origin "$REMOTE"
          fi
      - run: node scripts/build.mjs --out out --previous out/index.json
      - name: Push repo branch
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_build() {
            git add -A
            if git diff --cached --quiet; then return 1; fi
            git commit -q -m "Publish ${GITHUB_SHA::7}"
          }
          commit_build || { echo "nothing to publish"; exit 0; }
          for attempt in 1 2 3; do
            if git push origin repo; then exit 0; fi
            echo "::warning::push rejected (attempt $attempt), rebuilding on the latest repo branch"
            git fetch origin repo
            git reset --hard FETCH_HEAD
            node ../scripts/build.mjs --out . --previous index.json
            commit_build || { echo "nothing to publish"; exit 0; }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
