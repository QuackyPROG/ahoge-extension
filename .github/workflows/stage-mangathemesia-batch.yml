name: Stage MangaThemesia Candidate Batch

on:
  push:
    branches:
      - feature/mangathemesia-source-batch

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mangathemesia-source-batch
          fetch-depth: 0
      - name: Add candidate catalog entries and regenerate output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("catalog/sources.json")
          catalog = json.loads(path.read_text())
          revision = "b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"
          candidates = [
              {"packageId":"ahoge.extension.rackus","sourceId":"rackus-en","name":"Rackus","language":"en","version":"1.0.0","contentRating":"SAFE","engine":"mangaThemesia","adapter":None,"baseUrl":"https://rackusreads.com","apiUrl":None,"mirrors":[],"rateLimit":2,"priority":68,"maintenanceTier":1,"enabled":True,"upstream":{"repository":"keiyoushi/extensions-source","path":"src/en/rackus","family":"mangathemesia","revision":revision},"overrides":{},"notes":"Plain MangaThemesia source with no source-specific parser overrides; staged for live validation."},
              {"packageId":"ahoge.extension.mangatx","sourceId":"mangatx-en","name":"MangaTX","language":"en","version":"1.0.0","contentRating":"MIXED","engine":"mangaThemesia","adapter":None,"baseUrl":"https://mangatx.cc","apiUrl":None,"mirrors":[],"rateLimit":3,"priority":72,"maintenanceTier":1,"enabled":True,"upstream":{"repository":"keiyoushi/extensions-source","path":"src/en/mangatx","family":"mangathemesia","revision":revision},"overrides":{"mangaPath":"manga-list","dateFormat":"dd-MM-yyyy"},"notes":"MangaThemesia source using bounded manga path and date-format overrides; staged for live validation."},
              {"packageId":"ahoge.extension.ngomik","sourceId":"ngomik-id","name":"Ngomik","language":"id","version":"1.0.0","contentRating":"SAFE","engine":"mangaThemesia","adapter":None,"baseUrl":"https://02.ngomik.cc","apiUrl":None,"mirrors":[],"rateLimit":2,"priority":64,"maintenanceTier":1,"enabled":True,"upstream":{"repository":"keiyoushi/extensions-source","path":"src/id/ngomik","family":"mangathemesia","revision":revision},"overrides":{},"notes":"MangaThemesia source with upstream header customization; staged to verify the native runtime works without source-specific executable logic."},
              {"packageId":"ahoge.extension.noromax","sourceId":"noromax-id","name":"Noromax","language":"id","version":"1.0.0","contentRating":"SAFE","engine":"mangaThemesia","adapter":None,"baseUrl":"https://noromax02.my.id","apiUrl":None,"mirrors":[],"rateLimit":2,"priority":63,"maintenanceTier":1,"enabled":True,"upstream":{"repository":"keiyoushi/extensions-source","path":"src/id/noromax","family":"mangathemesia","revision":revision},"overrides":{},"notes":"Common MangaThemesia source; upstream page selector only excludes noscript duplicates. Staged for live validation."},
              {"packageId":"ahoge.extension.omicaso","sourceId":"omicaso-id","name":"Omicaso","language":"id","version":"1.0.0","contentRating":"MIXED","engine":"mangaThemesia","adapter":None,"baseUrl":"https://omicaso.org","apiUrl":None,"mirrors":[],"rateLimit":2,"priority":65,"maintenanceTier":1,"enabled":True,"upstream":{"repository":"keiyoushi/extensions-source","path":"src/id/omicaso","family":"mangathemesia","revision":revision},"overrides":{"mangaPath":"comik"},"notes":"Plain MangaThemesia source with a bounded manga-path override; staged for live validation."}
          ]
          existing = {entry["sourceId"] for entry in catalog["sources"]}
          for candidate in candidates:
              if candidate["sourceId"] not in existing:
                  catalog["sources"].append(candidate)
          path.write_text(json.dumps(catalog, separators=(",", ":"), ensure_ascii=False) + "\n")
          PY
          python3 scripts/build_index.py
          git rm .github/workflows/stage-mangathemesia-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sources.json sources index.json
          git commit -m "Stage MangaThemesia candidates for live health"
          git push origin HEAD:feature/mangathemesia-source-batch
