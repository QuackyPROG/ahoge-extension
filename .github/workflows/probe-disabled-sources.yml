name: Probe Disabled Sources

on:
  push:
    branches:
      - feature/retest-disabled-sources
    paths:
      - .github/workflows/probe-disabled-sources.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/retest-disabled-sources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Probe all disabled cataloged sources
        run: |
          python scripts/health_all.py \
            --include-disabled --probe-disabled \
            --source manganato-en \
            --source mangabat-en \
            --source mangakakalot-en \
            --source ezmanga-en \
            --source ikiru-id \
            --source luascans-en \
            --source bunmanga-en \
            --source spmanhwa-en \
            --source mangaka-en \
            --source manhuaus-en \
            --source toonizy-en \
            --source rackus-en \
            --source mangatx-en \
            --source ngomik-id \
            --source noromax-id \
            --source omicaso-id \
            --source asialotus-es \
            --source mangakusu-tr \
            --output /tmp/disabled-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: disabled-source-probe
          path: /tmp/disabled-probe.json
