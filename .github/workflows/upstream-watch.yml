name: Upstream watch
on:
  schedule: [{ cron: "30 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: "${{ github.token }}"
      GITHUB_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: gh label create upstream --color 0e8a16 --force
      - name: Watch upstream
        run: node scripts/upstream-watch.mjs --open-issues || echo "::warning::some upstream paths failed"
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update upstream lock"
          git pull --rebase
          git push
