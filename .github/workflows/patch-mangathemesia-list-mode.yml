name: Patch MangaThemesia List Mode Health

on:
  push:
    branches:
      - feature/mangathemesia-source-batch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mangathemesia-source-batch
          fetch-depth: 0
      - name: Ignore structural list-mode link in health sampling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/health_mangathemesia.py')
          text = path.read_text()
          old = '''        slug = parts[index + 1]
        if slug and slug not in seen:
            seen.add(slug)
            output.append(slug)
'''
          new = '''        slug = parts[index + 1]
        if slug.lower() == "list-mode":
            continue
        if slug and slug not in seen:
            seen.add(slug)
            output.append(slug)
'''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('MangaThemesia health slug anchor changed; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/patch-mangathemesia-list-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/health_mangathemesia.py
          git commit -m "Ignore MangaThemesia list-mode route in health sampling"
          git push origin HEAD:feature/mangathemesia-source-batch
