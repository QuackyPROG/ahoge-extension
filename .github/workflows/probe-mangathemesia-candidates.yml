name: Probe MangaThemesia Candidates

on:
  push:
    branches:
      - feature/mangathemesia-candidate-batch
    paths:
      - .github/workflows/probe-mangathemesia-candidates.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mangathemesia-candidate-batch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Probe staged disabled candidates
        run: |
          python scripts/health_all.py \
            --include-disabled --probe-disabled \
            --source madarascans-en \
            --source razure-en \
            --output /tmp/mangathemesia-candidate-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: mangathemesia-candidate-probe
          path: /tmp/mangathemesia-candidate-probe.json
