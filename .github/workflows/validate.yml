name: Validate Ahoge Extensions

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate source repository
        run: python scripts/validate.py
