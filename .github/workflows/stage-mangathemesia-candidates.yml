name: Stage MangaThemesia Candidates

on:
  push:
    branches:
      - feature/mangathemesia-candidate-batch
    paths:
      - .github/workflows/stage-mangathemesia-candidates.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mangathemesia-candidate-batch
      - name: Add disabled candidates to canonical catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('catalog/sources.json')
          data = json.loads(path.read_text())
          entries = [
            {
              "packageId":"ahoge.extension.madarascans",
              "sourceId":"madarascans-en",
              "name":"Madara Scans",
              "language":"en",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"mangaThemesia",
              "adapter":None,
              "baseUrl":"https://madarascans.net",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":70,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/en/madarascans","family":"mangathemesia","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{"mangaPath":"series"},
              "notes":"Staged disabled for bounded MangaThemesia live-health validation; upstream filters paid chapters."
            },
            {
              "packageId":"ahoge.extension.razure",
              "sourceId":"razure-en",
              "name":"Razure",
              "language":"en",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"mangaThemesia",
              "adapter":None,
              "baseUrl":"https://razure.org",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":67,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/en/razure","family":"mangathemesia","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{"mangaPath":"series"},
              "notes":"Staged disabled for bounded MangaThemesia live-health validation; upstream filters locked chapters."
            }
          ]
          existing = {s['sourceId'] for s in data['sources']}
          for entry in entries:
              if entry['sourceId'] not in existing:
                  data['sources'].append(entry)
          path.write_text(json.dumps(data, separators=(',', ':'), ensure_ascii=False) + '\n')
          PY
          rm .github/workflows/stage-mangathemesia-candidates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sources.json .github/workflows/stage-mangathemesia-candidates.yml
          git commit -m "Stage Madara Scans and Razure for health validation"
          git push origin HEAD:feature/mangathemesia-candidate-batch
