name: Stage Runtime-Fit Expansion

on:
  push:
    branches:
      - feature/runtime-fit-expansion-batch
    paths:
      - .github/workflows/stage-runtime-fit-expansion.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-fit-expansion-batch
      - name: Add disabled runtime-fit candidates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('catalog/sources.json')
          data = json.loads(path.read_text())
          entries = [
            {
              "packageId":"ahoge.extension.gomanga",
              "sourceId":"gomanga-th",
              "name":"Go Manga",
              "language":"th",
              "version":"1.0.0",
              "contentRating":"MIXED",
              "engine":"mangaThemesia",
              "adapter":None,
              "baseUrl":"https://www.go-manga.com",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":58,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/th/gomanga","family":"mangathemesia","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{},
              "notes":"Staged disabled for bounded MangaThemesia live-health validation."
            },
            {
              "packageId":"ahoge.extension.shinobiscans",
              "sourceId":"shinobiscans-it",
              "name":"Shinobi Scans",
              "language":"it",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"madara",
              "adapter":None,
              "baseUrl":"https://shinobiscans.com",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":62,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/it/shinobiscans","family":"madara","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{},
              "notes":"Staged disabled for bounded Madara live-health validation."
            },
            {
              "packageId":"ahoge.extension.anisascans",
              "sourceId":"anisascans-en",
              "name":"Anisa Scans",
              "language":"en",
              "version":"1.0.0",
              "contentRating":"MIXED",
              "engine":"madara",
              "adapter":None,
              "baseUrl":"https://anisascans.in",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":3,
              "priority":68,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/en/anisascans","family":"madara","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{"chapterMode":"mangaAjax"},
              "notes":"Staged disabled for bounded Madara live-health validation."
            }
          ]
          existing = {s['sourceId'] for s in data['sources']}
          for entry in entries:
              if entry['sourceId'] not in existing:
                  data['sources'].append(entry)
          path.write_text(json.dumps(data, separators=(',', ':'), ensure_ascii=False) + '\n')
          PY
          rm .github/workflows/stage-runtime-fit-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sources.json .github/workflows/stage-runtime-fit-expansion.yml
          git commit -m "Stage three runtime-fit source candidates"
          git push origin HEAD:feature/runtime-fit-expansion-batch
