name: Finalize MangaThemesia Candidates

on:
  push:
    branches:
      - feature/mangathemesia-candidate-batch
    paths:
      - .github/workflows/finalize-mangathemesia-candidates.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mangathemesia-candidate-batch
      - name: Promote Madara Scans and record Razure failure
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          catalog_path = Path('catalog/sources.json')
          catalog = json.loads(catalog_path.read_text())
          for source in catalog['sources']:
              if source['sourceId'] == 'madarascans-en':
                  source['enabled'] = True
                  source['notes'] = 'Shared MangaThemesia common-subset runtime; complete metadata health probe passed.'
              elif source['sourceId'] == 'razure-en':
                  source['enabled'] = False
                  source['notes'] = 'Tracked but disabled: current detail page does not expose the bounded MangaThemesia title/chapter markers required by Ahoge.'
          catalog_path.write_text(json.dumps(catalog, separators=(',', ':'), ensure_ascii=False) + '\n')

          updates = {
              'Madara Scans': {
                  'health':'healthy', 'decision':'include',
                  'reason':'Shared MangaThemesia common-subset runtime with series path override; complete Ahoge live-health validation passed.',
                  'scores':'{"popularity": 18, "engineFit": 25, "upstreamActivity": 20, "liveHealth": 15, "coverage": 8, "penalty": 0}',
                  'evidence':'health-verified', 'score':86,
              },
              'Razure': {
                  'health':'broken', 'decision':'disable',
                  'reason':'Current series detail markup does not expose the bounded MangaThemesia title/chapter markers; keep disabled rather than add source-specific selectors.',
                  'scores':'{"popularity": 10, "engineFit": 18, "upstreamActivity": 20, "liveHealth": 0, "coverage": 8, "penalty": -10}',
                  'evidence':'health-verified', 'score':46,
              },
          }
          path = Path('catalog/candidates.json')
          text = path.read_text()
          for name, update in updates.items():
              marker = f'    {{\n      "name": "{name}",'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'candidate not found: {name}')
              end = text.find('\n    },', start)
              if end < 0:
                  raise SystemExit(f'candidate end not found: {name}')
              end += len('\n    },')
              block = text[start:end]
              block = re.sub(r'("health": )"[^"]+"', rf'\1"{update["health"]}"', block, count=1)
              block = re.sub(r'("decision": )"[^"]+"', rf'\1"{update["decision"]}"', block, count=1)
              block = re.sub(r'("reason": )"[^"]*"', rf'\1"{update["reason"]}"', block, count=1)
              block = re.sub(r'"scores": \{[^\n]+\}', f'"scores": {update["scores"]}', block, count=1)
              block = re.sub(r'("evidence": )"[^"]+"', rf'\1"{update["evidence"]}"', block, count=1)
              block = re.sub(r'("score": )-?\d+', rf'\g<1>{update["score"]}', block, count=1)
              text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
          python3 scripts/build_index.py
          python3 scripts/build_source_report.py
          rm .github/workflows/probe-mangathemesia-candidates.yml
          rm .github/workflows/finalize-mangathemesia-candidates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sources.json catalog/candidates.json index.json sources Docs/source-catalog-report.md .github/workflows/probe-mangathemesia-candidates.yml .github/workflows/finalize-mangathemesia-candidates.yml
          git commit -m "Add health-verified Madara Scans source"
          git push origin HEAD:feature/mangathemesia-candidate-batch
