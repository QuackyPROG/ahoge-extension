name: Finalize MangaDex Candidate Evidence

on:
  push:
    branches:
      - feature/mangadex-source

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mangadex-source
          fetch-depth: 0
      - name: Promote MangaDex and regenerate source report
        run: |
          python3 -c 'import json; from pathlib import Path; p=Path("catalog/candidates.json"); x=json.loads(p.read_text()); c=next(i for i in x["candidates"] if i.get("name")=="MangaDex"); c.update({"engine":"api/mangadex","health":"healthy","decision":"include","reason":"Dedicated native public MangaDex v5 API/MangaDex@Home adapter; complete Ahoge live-health validation passed.","evidence":"health-verified"}); c["scores"]["engineFit"]=25; c["scores"]["liveHealth"]=15; c["score"]=sum(c["scores"].values()); p.write_text(json.dumps(x,indent=2,ensure_ascii=False)+"\n")'
          python3 scripts/build_source_report.py
          git rm .github/workflows/finalize-mangadex-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/candidates.json Docs/source-catalog-report.md
          git commit -m "Record MangaDex health-verified catalog evidence"
          git push origin HEAD:feature/mangadex-source
