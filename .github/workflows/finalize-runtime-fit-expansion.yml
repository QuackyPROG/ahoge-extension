name: Finalize Runtime-Fit Expansion

on:
  push:
    branches:
      - feature/runtime-fit-expansion-batch
    paths:
      - .github/workflows/finalize-runtime-fit-expansion.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-fit-expansion-batch
      - name: Promote healthy sources and keep candidate set capped at 50
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('catalog/sources.json')
          catalog = json.loads(catalog_path.read_text())
          kept = []
          found = set()
          for source in catalog['sources']:
              sid = source['sourceId']
              if sid == 'gomanga-th':
                  continue
              if sid == 'shinobiscans-it':
                  source['enabled'] = True
                  source['notes'] = 'Plain Madara runtime; complete Ahoge metadata health validation passed.'
                  found.add(sid)
              elif sid == 'anisascans-en':
                  source['enabled'] = True
                  source['notes'] = 'Bounded Madara mangaAjax runtime; complete Ahoge metadata health validation passed.'
                  found.add(sid)
              kept.append(source)
          missing = {'shinobiscans-it', 'anisascans-en'} - found
          if missing:
              raise SystemExit(f'missing staged sources: {sorted(missing)}')
          catalog['sources'] = kept
          catalog_path.write_text(json.dumps(catalog, separators=(',', ':'), ensure_ascii=False) + '\n')

          candidates_path = Path('catalog/candidates.json')
          data = json.loads(candidates_path.read_text())
          candidates = data['candidates']
          replacements = {
              'Qtoon': {
                  'name': 'Shinobi Scans',
                  'engine': 'madara',
                  'maintenanceTier': 1,
                  'health': 'healthy',
                  'decision': 'include',
                  'reason': 'Plain Madara runtime; complete Ahoge live-health validation passed and adds Italian catalog coverage.',
                  'scores': {'popularity': 10, 'engineFit': 25, 'upstreamActivity': 20, 'liveHealth': 15, 'coverage': 10, 'penalty': 0},
                  'upstream': {'repository': 'keiyoushi/extensions-source', 'path': 'src/it/shinobiscans', 'revision': 'b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0'},
                  'evidence': 'health-verified',
                  'score': 80,
              },
              'Toonly': {
                  'name': 'Anisa Scans',
                  'engine': 'madara',
                  'maintenanceTier': 1,
                  'health': 'healthy',
                  'decision': 'include',
                  'reason': 'Bounded Madara mangaAjax runtime with declarative chapter mode; complete Ahoge live-health validation passed.',
                  'scores': {'popularity': 14, 'engineFit': 25, 'upstreamActivity': 20, 'liveHealth': 15, 'coverage': 8, 'penalty': 0},
                  'upstream': {'repository': 'keiyoushi/extensions-source', 'path': 'src/en/anisascans', 'revision': 'b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0'},
                  'evidence': 'health-verified',
                  'score': 82,
              },
          }
          names = [c.get('name') for c in candidates]
          for old, new in replacements.items():
              try:
                  index = names.index(old)
              except ValueError:
                  raise SystemExit(f'candidate to replace not found: {old}')
              candidates[index] = new
          if len(candidates) != 50:
              raise SystemExit(f'candidate count changed unexpectedly: {len(candidates)}')
          if len({c['name'] for c in candidates}) != 50:
              raise SystemExit('candidate names are not unique after replacement')
          # Preserve compact, reviewable object-per-line formatting used by this repository.
          lines = ['{', '  "schemaVersion": 1,', '  "methodology": ' + json.dumps(data['methodology'], ensure_ascii=False, separators=(',', ':')) + ',', '  "candidates": [']
          for i, candidate in enumerate(candidates):
              suffix = ',' if i < len(candidates) - 1 else ''
              lines.append('    ' + json.dumps(candidate, ensure_ascii=False, separators=(',', ':')) + suffix)
          lines.extend(['  ]', '}'])
          candidates_path.write_text('\n'.join(lines) + '\n')
          PY
          python3 scripts/build_index.py
          python3 scripts/build_source_report.py
          rm .github/workflows/probe-runtime-fit-expansion.yml
          rm .github/workflows/finalize-runtime-fit-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sources.json catalog/candidates.json index.json sources Docs/source-catalog-report.md .github/workflows/probe-runtime-fit-expansion.yml .github/workflows/finalize-runtime-fit-expansion.yml
          git commit -m "Add two health-verified runtime-fit sources"
          git push origin HEAD:feature/runtime-fit-expansion-batch
