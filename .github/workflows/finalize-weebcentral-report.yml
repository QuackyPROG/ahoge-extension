name: Finalize WeebCentral Report

on:
  push:
    branches: [feature/weebcentral-source]
    paths:
      - .github/workflows/finalize-weebcentral-report.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weebcentral-source
          fetch-depth: 0
      - name: Promote health evidence and regenerate report
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('catalog/candidates.json')
          text = p.read_text()
          start = text.index('    {\n      "name": "WeebCentral",')
          end = text.index('\n    },\n    {', start) + len('\n    }')
          block = text[start:end]
          replacements = {
              '"engine": "custom/API"': '"engine": "api/weebcentral"',
              '"health": "not-tested"': '"health": "healthy"',
              '"decision": "defer"': '"decision": "include"',
              '"reason": "High-value custom KeiSource. Good candidate for a stable bespoke Swift adapter; no current Ahoge runtime."': '"reason": "Dedicated native public WeebCentral reading adapter; complete Ahoge live-health validation passed."',
              '"scores": {"popularity": 30, "engineFit": 12, "upstreamActivity": 20, "liveHealth": 0, "coverage": 10, "penalty": 0}': '"scores": {"popularity": 30, "engineFit": 25, "upstreamActivity": 20, "liveHealth": 15, "coverage": 10, "penalty": 0}',
              '"evidence": "upstream-reviewed"': '"evidence": "health-verified"',
              '"score": 72': '"score": 100',
          }
          for old, new in replacements.items():
              if old not in block:
                  raise SystemExit(f'missing expected WeebCentral candidate text: {old}')
              block = block.replace(old, new, 1)
          p.write_text(text[:start] + block + text[end:])

          p = Path('scripts/build_source_report.py')
          text = p.read_text()
          needle = '    ("api / mangadex", "api", "mangadex", "Yes", "Yes", "Live health"),\n'
          row = '    ("api / weebcentral", "api", "weebcentral", "Yes", "Yes", "Live health"),\n'
          if row not in text:
              if needle not in text:
                  raise SystemExit('MangaDex runtime row not found')
              text = text.replace(needle, needle + row, 1)
          old = '        "4. MangaDex now has a dedicated native public-API adapter. Evaluate the remaining Tier-2 bespoke candidates such as WeebCentral and Kagane individually rather than adding generic remote scripting.",'
          new = '        "4. MangaDex and WeebCentral now have dedicated bounded native adapters. Evaluate the remaining Tier-2 bespoke candidates such as Kagane individually rather than adding generic remote scripting.",'
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          python3 scripts/build_source_report.py
          rm .github/workflows/finalize-weebcentral-report.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/candidates.json scripts/build_source_report.py Docs/source-catalog-report.md .github/workflows/finalize-weebcentral-report.yml
          git commit -m "Promote health-verified WeebCentral source"
          git push origin HEAD:feature/weebcentral-source
