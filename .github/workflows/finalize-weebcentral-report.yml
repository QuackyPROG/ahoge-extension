name: Finalize WeebCentral Health Evidence

on:
  push:
    branches:
      - feature/weebcentral-source

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weebcentral-source
          fetch-depth: 0
      - name: Promote candidate and regenerate report
        run: |
          python3 -c 'from pathlib import Path; import re; p=Path("catalog/candidates.json"); t=p.read_text(); pattern=r"    \{\n      \"name\": \"WeebCentral\",[\s\S]*?\n    \},"; replacement="""    {\n      \"name\": \"WeebCentral\",\n      \"engine\": \"api/weebcentral\",\n      \"maintenanceTier\": 2,\n      \"health\": \"healthy\",\n      \"decision\": \"include\",\n      \"reason\": \"Dedicated native public WeebCentral reading adapter; complete Ahoge live-health validation passed.\",\n      \"scores\": {\"popularity\": 30, \"engineFit\": 25, \"upstreamActivity\": 20, \"liveHealth\": 15, \"coverage\": 10, \"penalty\": 0},\n      \"upstream\": {\"repository\": \"keiyoushi/extensions-source\", \"path\": \"src/en/weebcentral\", \"revision\": \"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0\"},\n      \"evidence\": \"health-verified\",\n      \"score\": 100\n    },"""; t2,n=re.subn(pattern,replacement,t,count=1); assert n==1, "WeebCentral candidate block not found"; p.write_text(t2)'
          python3 -c 'from pathlib import Path; p=Path("scripts/build_source_report.py"); t=p.read_text(); old="    (\"api / mangadex\", \"api\", \"mangadex\", \"Yes\", \"Yes\", \"Live health\"),\n"; new=old+"    (\"api / weebcentral\", \"api\", \"weebcentral\", \"Yes\", \"Yes\", \"Live health\"),\n"; assert old in t or "api / weebcentral" in t, "runtime row anchor changed"; t=t.replace(old,new,1) if "api / weebcentral" not in t else t; old2="        \"4. MangaDex now has a dedicated native public-API adapter. Evaluate the remaining Tier-2 bespoke candidates such as WeebCentral and Kagane individually rather than adding generic remote scripting.\",\n"; new2="        \"4. MangaDex and WeebCentral now have dedicated bounded native adapters. Evaluate the remaining Tier-2 bespoke candidates such as Kagane and Atsumaru individually rather than adding generic remote scripting.\",\n"; assert old2 in t or new2 in t, "implementation-order anchor changed"; p.write_text(t.replace(old2,new2,1))'
          python3 scripts/build_source_report.py
          git rm .github/workflows/finalize-weebcentral-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/candidates.json scripts/build_source_report.py Docs/source-catalog-report.md
          git commit -m "Record WeebCentral health-verified catalog evidence"
          git push origin HEAD:feature/weebcentral-source
