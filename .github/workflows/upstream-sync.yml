name: Curated Upstream Sync

on:
  schedule:
    - cron: "41 17 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Inspect curated upstream modules
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_upstreams.py --apply-low-risk --output upstream/report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Regenerate repository output
        run: python scripts/build_index.py
      - name: Validate generated repository
        run: |
          python -m py_compile scripts/*.py
          python scripts/validate.py
      - name: Health-check enabled sources before automation PR
        if: ${{ hashFiles('catalog/sources.json') != '' }}
        run: python scripts/healthcheck.py --strict --output /tmp/ahoge-health.json
      - name: Publish low-risk update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- catalog/sources.json sources index.json; then
            echo "No low-risk catalog changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/upstream-sync
          git add catalog/sources.json sources index.json
          git commit -m "Sync low-risk upstream source metadata"
          git push --force origin HEAD:automation/upstream-sync
          number="$(gh pr list --state open --head automation/upstream-sync --base main --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --base main --head automation/upstream-sync --title "Sync curated upstream source metadata" --body "Automated low-risk upstream metadata sync. Generated output and live health checks passed before this PR was created."
          else
            echo "Updated existing upstream sync PR #$number"
          fi
      - name: Open or update runtime-review issue for high-risk drift
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream source changes need runtime review"
          body_file="$(mktemp)"
          {
            echo "The curated upstream scan detected high-risk drift or an unavailable tracked module. No high-risk change was applied automatically."
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```json'
            cat upstream/report.json
            echo '```'
          } > "$body_file"
          number="$(gh issue list --state open --search \"$title in:title\" --json number,title --jq '.[] | select(.title == \"'"$title"'\") | .number' | head -n1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
      - name: Upload sync reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-${{ github.run_id }}
          path: |
            upstream/report.json
            /tmp/ahoge-health.json
          if-no-files-found: warn
