name: Regenerate WeebCentral Report

on:
  push:
    branches:
      - feature/weebcentral-source
    paths:
      - .github/workflows/regenerate-weebcentral-report.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weebcentral-source
      - name: Regenerate report
        run: python3 scripts/build_source_report.py
      - name: Commit generated report and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regenerate-weebcentral-report.yml
          git add Docs/source-catalog-report.md .github/workflows/regenerate-weebcentral-report.yml
          git commit -m "Regenerate source report after WeebCentral health verification"
          git push origin HEAD:feature/weebcentral-source
