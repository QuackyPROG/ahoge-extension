name: Health
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-branch
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: git clone --branch repo --single-branch --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
      - run: node scripts/check.mjs --dir out --write --report health-report.json
      - run: node scripts/sync-issues.mjs health-report.json
      - name: Push health
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Health check $(date -u +%Y-%m-%d)"
          git push origin repo
