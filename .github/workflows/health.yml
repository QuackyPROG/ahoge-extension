name: Health
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Clone repo branch
        id: repo
        env: { REMOTE: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" }
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" repo >/dev/null; then
            git clone --branch repo --single-branch --depth 1 "$REMOTE" out
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::repo branch does not exist yet, nothing to check"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check sources
        if: steps.repo.outputs.exists == 'true'
        run: node scripts/check.mjs --dir out --write --report health-report.json
      - name: Push health
        if: steps.repo.outputs.exists == 'true'
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_health() {
            git add index.json
            if git diff --cached --quiet; then return 1; fi
            git commit -q -m "Health check $(date -u +%Y-%m-%d)"
          }
          commit_health || { echo "no health changes"; exit 0; }
          for attempt in 1 2 3; do
            if git push origin repo; then exit 0; fi
            echo "::warning::push rejected (attempt $attempt), re-applying health on the latest repo branch"
            git fetch origin repo
            git reset --hard FETCH_HEAD
            node ../scripts/check.mjs --dir . --apply-report ../health-report.json
            commit_health || { echo "no health changes"; exit 0; }
          done
          echo "::error::could not push health after 3 attempts"
          exit 1
      - name: Sync issues
        if: steps.repo.outputs.exists == 'true'
        run: node scripts/sync-issues.mjs health-report.json
