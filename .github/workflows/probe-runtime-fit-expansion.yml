name: Probe Runtime-Fit Expansion

on:
  push:
    branches:
      - feature/runtime-fit-expansion-batch
    paths:
      - .github/workflows/probe-runtime-fit-expansion.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-fit-expansion-batch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Probe staged disabled candidates
        run: |
          python scripts/health_all.py \
            --include-disabled --probe-disabled \
            --source gomanga-th \
            --source shinobiscans-it \
            --source anisascans-en \
            --output /tmp/runtime-fit-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-fit-probe
          path: /tmp/runtime-fit-probe.json
