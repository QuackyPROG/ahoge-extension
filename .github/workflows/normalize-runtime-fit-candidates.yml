name: Normalize Runtime-Fit Candidates

on:
  push:
    branches:
      - feature/runtime-fit-expansion-batch
    paths:
      - .github/workflows/normalize-runtime-fit-candidates.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-fit-expansion-batch
          fetch-depth: 0
      - name: Restore formatting and replace only two candidate blocks
        run: |
          git show origin/main:catalog/candidates.json > /tmp/candidates-main.json
          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/candidates-main.json').read_text()
          replacements = {
              'Qtoon': '''    {
      "name": "Shinobi Scans",
      "engine": "madara",
      "maintenanceTier": 1,
      "health": "healthy",
      "decision": "include",
      "reason": "Plain Madara runtime; complete Ahoge live-health validation passed and adds Italian catalog coverage.",
      "scores": {"popularity": 10, "engineFit": 25, "upstreamActivity": 20, "liveHealth": 15, "coverage": 10, "penalty": 0},
      "upstream": {"repository": "keiyoushi/extensions-source", "path": "src/it/shinobiscans", "revision": "b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
      "evidence": "health-verified",
      "score": 80
    },''',
              'Toonly': '''    {
      "name": "Anisa Scans",
      "engine": "madara",
      "maintenanceTier": 1,
      "health": "healthy",
      "decision": "include",
      "reason": "Bounded Madara mangaAjax runtime with declarative chapter mode; complete Ahoge live-health validation passed.",
      "scores": {"popularity": 14, "engineFit": 25, "upstreamActivity": 20, "liveHealth": 15, "coverage": 8, "penalty": 0},
      "upstream": {"repository": "keiyoushi/extensions-source", "path": "src/en/anisascans", "revision": "b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
      "evidence": "health-verified",
      "score": 82
    },''',
          }
          for old_name, replacement in replacements.items():
              marker = f'    {{\n      "name": "{old_name}",'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'candidate block not found: {old_name}')
              end = text.find('\n    },', start)
              if end < 0:
                  raise SystemExit(f'candidate block end not found: {old_name}')
              end += len('\n    },')
              text = text[:start] + replacement + text[end:]
          Path('catalog/candidates.json').write_text(text)
          PY
          python3 scripts/build_source_report.py
          rm .github/workflows/normalize-runtime-fit-candidates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/candidates.json Docs/source-catalog-report.md .github/workflows/normalize-runtime-fit-candidates.yml
          git commit -m "Keep runtime-fit candidate updates surgical"
          git push origin HEAD:feature/runtime-fit-expansion-batch
