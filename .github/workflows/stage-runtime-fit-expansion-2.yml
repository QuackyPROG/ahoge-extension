name: Stage Runtime-Fit Expansion 2

on:
  push:
    branches:
      - feature/runtime-fit-expansion-batch-2
    paths:
      - .github/workflows/stage-runtime-fit-expansion-2.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-fit-expansion-batch-2
      - name: Add disabled runtime-fit candidates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('catalog/sources.json')
          data = json.loads(path.read_text())
          entries = [
            {
              "packageId":"ahoge.extension.anikiga",
              "sourceId":"anikiga-tr",
              "name":"Anikiga",
              "language":"tr",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"madara",
              "adapter":None,
              "baseUrl":"https://anikiga.com",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":60,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/tr/anikiga","family":"madara","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{"chapterMode":"mangaAjax"},
              "notes":"Staged disabled for bounded Madara live-health validation. Locale-specific chapter dates are not relied on for compatibility."
            },
            {
              "packageId":"ahoge.extension.marmota",
              "sourceId":"marmota-es",
              "name":"Marmota",
              "language":"es",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"madara",
              "adapter":None,
              "baseUrl":"https://marmota.me",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":61,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/es/marmota","family":"madara","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{"mangaPath":"comic","chapterMode":"mangaAjax"},
              "notes":"Staged disabled for bounded Madara live-health validation."
            },
            {
              "packageId":"ahoge.extension.mangalek",
              "sourceId":"mangalek-ar",
              "name":"Mangalek",
              "language":"ar",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"madara",
              "adapter":None,
              "baseUrl":"https://mangalik.net",
              "apiUrl":None,
              "mirrors":["https://lekmanga.online","https://like-manga.net","https://lekmanga.site","https://manga-leko.site"],
              "rateLimit":2,
              "priority":64,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/ar/mangalek","family":"madara","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{},
              "notes":"Staged disabled for bounded Madara live-health validation; current upstream mirror set preserved."
            },
            {
              "packageId":"ahoge.extension.manhwanex",
              "sourceId":"manhwanex-en",
              "name":"ManhwaNex",
              "language":"en",
              "version":"1.0.0",
              "contentRating":"SAFE",
              "engine":"madara",
              "adapter":None,
              "baseUrl":"https://manhwanex.com",
              "apiUrl":None,
              "mirrors":[],
              "rateLimit":2,
              "priority":66,
              "maintenanceTier":1,
              "enabled":False,
              "upstream":{"repository":"keiyoushi/extensions-source","path":"src/en/manhwanex","family":"madara","revision":"b5d2cd5c3d23a3408c7daa3eb807668aedfce3e0"},
              "overrides":{"chapterMode":"mangaAjax"},
              "notes":"Staged disabled for bounded Madara live-health validation."
            }
          ]
          existing = {source['sourceId'] for source in data['sources']}
          for entry in entries:
              if entry['sourceId'] not in existing:
                  data['sources'].append(entry)
          path.write_text(json.dumps(data, separators=(',', ':'), ensure_ascii=False) + '\n')
          PY
          rm .github/workflows/stage-runtime-fit-expansion-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sources.json .github/workflows/stage-runtime-fit-expansion-2.yml
          git commit -m "Stage second runtime-fit source batch"
          git push origin HEAD:feature/runtime-fit-expansion-batch-2
